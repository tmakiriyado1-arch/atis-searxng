# SearXNG Configuration for ATIS/NORA Test Server
# Native Python installation for GitHub Codespaces
# https://github.com/searxng/searxng

# ============================================================================
# GENERAL SETTINGS
# ============================================================================
# Use default settings and merge with our customizations
# This tells SearXNG to merge our settings with the defaults rather than replace them
use_default_settings: false

general:
  debug: false
  instance_name: "ATIS SearXNG Test"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false
  open_metrics: ''

# DOI resolver settings (required by preferences.py)
doi_resolvers:
  oadoi.org: 'https://oadoi.org/'
  doi.org: 'https://doi.org/'

default_doi_resolver: 'oadoi.org'

brand:
  docs_url: https://docs.searxng.org/
  public_instances: https://searx.space
  wiki_url: https://github.com/searxng/searxng/wiki
  issue_url: https://github.com/searxng/searxng/issues

# ============================================================================
# SEARCH SETTINGS
# ============================================================================
search:
  safe_search: 0
  autocomplete: ""
  autocomplete_min: 4
  favicon_resolver: ""
  default_lang: "en"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspended_times:
    SearxEngineAccessDenied: 180
    SearxEngineCaptcha: 3600
    SearxEngineTooManyRequests: 180
    cf_SearxEngineCaptcha: 1296000
    cf_SearxEngineAccessDenied: 86400
    recaptcha_SearxEngineCaptcha: 604800

  # CRITICAL: Enable JSON format for NORA integration
  formats:
    - html
    - json

# ============================================================================
# SERVER SETTINGS
# ============================================================================
server:
  # Bind to all interfaces for Codespaces port forwarding
  port: 8888
  bind_address: "0.0.0.0"
  base_url: false
  
  # CRITICAL: Enable GET method for NORA HTTP GET requests
  method: "GET"
  
  # No authentication required for this test instance
  limiter: false
  public_instance: false
  # secret_key must be set via SEARXNG_SECRET environment variable
  # DO NOT commit secret keys to git
  secret_key: ""
  image_proxy: false
  http_protocol_version: "1.1"
  
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

# ============================================================================
# VALKEY (Redis-compatible) - Disabled for this test
# ============================================================================
valkey:
  url: false

# ============================================================================
# UI SETTINGS - Minimal for test instance
# ============================================================================
ui:
  static_path: ""
  templates_path: ""
  query_in_title: false
  default_theme: simple
  center_alignment: false
  simple_style: auto
  search_on_category_select: true
  hotkeys: default
  url_formatting: pretty

# ============================================================================
# PREFERENCES
# ============================================================================
preferences:
  lock: []

# ============================================================================
# OUTGOING REQUEST SETTINGS
# ============================================================================
outgoing:
  request_timeout: 10.0
  max_request_timeout: 30.0
  useragent_suffix: "ATIS-NORA-Test"
  pool_connections: 100
  enable_http2: true

# ============================================================================
# LOGGING SETTINGS
# ============================================================================
# Enable logging to see engine success/failure for diagnostics
logging:
  config:
    version: 1
    disable_existing_loggers: false
    formatters:
      simple:
        format: '[%(asctime)s] %(levelname)s in %(module)s: %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        level: INFO
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers: [console]

# ============================================================================
# CATEGORIES
# ============================================================================
categories:
  - name: general
    label: General
  - name: web
    label: Web

# ============================================================================
# SEARCH ENGINES
# ============================================================================
# Strategy: Start with engines that:
# 1. Require NO API key
# 2. Are appropriate for general web/entity research
# 3. Return actual search results
# 4. Can be tested from Codespaces
#
# Enabled engines (tested and working without credentials):
# - wikipedia: General knowledge, no API key required
# - wikidata: Structured data, no API key required  
# - qwant: General web search, no API key required
#
# Disabled by default but available:
# - mojeek: General web search, no API key, but may have CAPTCHA
# - duckduckgo: May have network issues from Render
#
# Note: Test each engine individually. Disable any that fail.

engines:
  # Wikipedia - supporting engine, never leading
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    display_type: ["infobox", "list"]
    categories: [general]
    weight: 0

  # Wikidata - supporting engine, never leading
  - name: wikidata
    engine: wikidata
    shortcut: wd
    display_type: ["infobox", "list"]
    categories: [general]
    weight: 0

  # Qwant - DISABLED: too many requests / access denied
  - name: qwant
    engine: qwant
    qwant_categ: web
    shortcut: qw
    categories: [general, web]
    disabled: true
    weight: 1

  # Mojeek - DISABLED: access denied
  - name: mojeek
    engine: mojeek
    shortcut: mjk
    categories: [general, web]
    disabled: true
    weight: 1

  # Brave - DISABLED: too many requests
  - name: brave
    engine: brave
    shortcut: br
    disabled: true
    categories: [general, web]

  - name: brave.images
    engine: brave
    shortcut: brimg
    disabled: true
    categories: [images, web]

  - name: brave.videos
    engine: brave
    shortcut: brvid
    disabled: true
    categories: [videos, web]

  - name: brave.news
    engine: brave
    shortcut: brnews
    disabled: true
    categories: [news]

  # Google CSE - DISABLED: requires API key, name cannot contain underscore
  # - name: google_cse
  #   engine: google_cse
  #   shortcut: gcs
  #   categories: [general, web]

  # Primary engines (weight: 2) - most reliable results
  # Google - re-enabled for diagnostic testing
  - name: google
    engine: google
    shortcut: go
    categories: [general, web]
    disabled: false
    weight: 2

  # Bing - DISABLED: poor result quality, no keyword matching
  - name: bing
    engine: bing
    shortcut: bi
    categories: [general, web]
    disabled: true
    weight: 2

  # DuckDuckGo - DISABLED: timing out
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    categories: [general, web]
    disabled: true
    weight: 2

  # Yandex - free, no API key, good for non-English results
  - name: yandex
    engine: yandex
    shortcut: yd
    categories: [general, web]
    weight: 2
    results_per_page: 10

  # Swisscows - DISABLED: results_per_page validation issue
  # - name: swisscows
  #   engine: swisscows
  #   shortcut: sw
  #   categories: [general, web]
  #   weight: 1

  # All other engines disabled by default
  # Uncomment additional engines as needed after testing

  - name: 360search
    engine: 360search
    shortcut: 360so
    disabled: true
